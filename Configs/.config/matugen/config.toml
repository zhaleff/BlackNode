[config]
reload_apps = true

[templates.hyprlang]
input_path = '~/.config/matugen/templates/hyprlang.conf'
output_path = '~/.config/hypr/scheme/hyprlang.conf'

[templates.walker]
input_path = '~/.config/matugen/templates/walker.css'
output_path = '~/.config/walker/colors.css'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/colors.conf'

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar.css'
output_path = '~/.config/waybar/colors.css'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.dunst]
input_path = '~/.config/matugen/templates/dunstrc'
output_path = '~/.config/dunst/dunstrc'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.config/hypr/themes/colors.lua'

[templates.wlogout]
input_path = '~/.config/matugen/templates/wlogout.css'
output_path = '~/.config/wlogout/colors.css'

[templates.cava]
input_path = '~/.config/matugen/templates/cava'
output_path = '~/.config/cava/config'


[templates.neovim]
input_path = '~/.config/matugen/templates/nvim.lua'
output_path = '~/.config/nvim/generated.lua'
post_hook = 'pkill -SIGUSR1 nvim'

[templates.clipse]
input_path = '~/.config/matugen/templates/clipse_theme.json'
output_path = '~/.config/clipse/blacknode.json'

# [templates.nvim]
# input_path = '~/.config/matugen/templates/nvim.lua'
# output_path = '~/.config/nvim/lua/core/config/colors.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock.conf'
output_path = '~/.config/hyprlock/hyprlock.conf'

[templates.btop]
input_path = '~/.config/matugen/templates/btop'
output_path = '~/.config/btop/themes/colors.theme'

[templates.vscode-raw]
input_path = './templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = './templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'
