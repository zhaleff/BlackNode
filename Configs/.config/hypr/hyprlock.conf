source = ~/.config/hypr/themes/hyprlang.conf

general {
    grace = 3
    no_fade_in = false
    disable_loading_bar = false
    hide_cursor = true
    ignore_empty_password = false
    immediate_render = true
}

background {
    monitor =
    path = ~/.config/hypr/hyprlock.png
    blur_passes = 2
    blur_size = 4
    noise = 0.02
}



label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_family = JetBrainsMono Nerd Font
    font_weight = bold
    font_size = 96
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(255, 255, 255, 0.5)
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    position = 0, 100
    halign = center
    valign = center
}

shape {
    monitor =
    size = 200, 2
    color = rgba(255, 255, 255, 0.15)
    rounding = 1
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dot_size = 5
    dots_spacing = 4
    dots_center = true
    rounding = 30
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(255, 255, 255, 0.05)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = true
    font_family = JetBrainsMono Nerd Font
    font_size = 16
    placeholder_text = Hello, $USER
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.3)
}




shape {
    monitor =
    size = 320, 140
    color = rgba(15, 15, 20, 0.55)
    rounding = 28
    border_size = 2
    border_color = rgba(255, 255, 255, 0.08)
    position = 0, 320
    halign = right
    valign = top
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}



label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/weather.sh
    color = rgba(255, 255, 255, 0.9)
    font_family = JetBrainsMono Nerd Font
    text_align = right
    position = -40, -40
    halign = right
    valign = top
}

# Music
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/media.sh
    color = rgba(255, 255, 255, 0.95)
    font_family = JetBrainsMono Nerd Font
    text_align = left
    position = 20, 20
    halign = left
    valign = bottom
}
