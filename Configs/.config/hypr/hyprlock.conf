source = ~/.config/hypr/themes/hyprlang.conf

general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 0
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = ~/.config/hypr/hyprlock.png
    blur_size = 2
    blur_passes = 0
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 60
    outline_thickness = 2
    dots_size = 0.30
    rounding = 16
    dots_spacing = 0.15
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.3)
    font_color = $on_background
    fade_on_empty = true
    placeholder_text = <i>   Locked</i>
    outer_color = rgba(255, 255, 255, 0.3)
    hide_input = false
    position = 0, -150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    color = $on_background
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    color = $on_background
    font_size = 18
    font_family = Inter Display Medium
    position = 0, -95
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:18000000] echo "<b> $(date +'%A, %-d %B %Y') </b>"
    color = $on_background
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/media.sh)"
    color = $on_background
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/weather.sh)"
    color = $on_background
    font_size = 12
    position = 50, -10
    halign = center
    valign = top
}
