source = ~/.config/hypr/scheme/hyprlang.conf
general {
  grace = 3
  no_fade_in = false
  disable_loanding_bar = false
  hide_cursor = true
  ignore_empty_password = false
  immediate_redering = true
}
# Background :D
background {
  monitor =

  path = ~/.config/hypr/hyprlock.png
}
# password
input-field {
    monitor =
    background = $surface

    size = 250, 80
    outline_thickness = 2
    dot_size = 0.30
    rounding = 32
    dots_spacing = true
    dots_center = true
    outer_color = transparent
    inner_color = $surface
    font_color = $on_surface_variant
    fade_on_empty = true
    placeholder_text = <i>Hi, $USER</i> # Text rendered in th>
    position = 170, 180
    halign = left
    valign = bottom
}
# DATE TIME HOUR
label {
  monitor =
  text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
  color = $primary
  position = 116, 100
  font_size = 110
  font_family = JetBrainsMono Nerd Font
  halign = left
  valign = center
}
# DATE TIME MINUTE
label {
  text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
  color = $on_surface
  monitor  =
  font_family = JetBrainsMono Nerd Font
  font_size = 120
  position =  100, 240
  halign = left
  valign = bottom
}
# Power
label {
    monitor =
    text = 󰐥  󰜉  󰤄
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    position = 160, 100
    halign = left
    valign = bottom
}
#uptime
label {
  monitor =
  font_family = JetBrainsMono Nerd Font
  text = cmd[update:1000] echo "$(echo -e "Uptime" | uptime -p | sed -e 's/up //g')"
  color = $on_surface
  font_size = 12
  position = -410, 130
  halign = right
  valign = bottom
}
label {
  monitor =
  text = cmd[update:10000] echo "$(~/.config/hypr/Scripts/songdetail.sh)"
  color = $on_surface
  font_family = JetBrainsMono Nerd Font
  font_size = 12
  position = -260, 80
  halign = right
  valign = bottom
}
