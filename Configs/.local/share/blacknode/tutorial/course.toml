title = "BlackNode"
subtitle = "Your home in the terminal"

[[chapters]]
id = "welcome"
title = "Welcome"

[[chapters.steps]]
title = "Hello and welcome"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "BlackNode is a complete desktop built on Hyprland. It is fast, readable and changes color to match your wallpaper."
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "This tour takes a few minutes and never asks you to do anything",
  "Press enter or → to move forward, ← to go back",
  "Press q anytime to leave — you can resume exactly where you stopped",
]
[[chapters.steps.blocks]]
kind = "tip"
text = "Reopen this tour anytime with SUPER + F1."

[[chapters]]
id = "philosophy"
title = "Philosophy"

[[chapters.steps]]
title = "How BlackNode thinks"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "Everything is one cohesive system: a color engine, a menu hub, profiles and small tools that work together."
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "Clear structure — no obscure hacks",
  "Modular — remove a component without breaking the rest",
  "Readable files you can open and edit",
  "Classic components, fast on modest hardware",
]
[[chapters.steps.blocks]]
kind = "tip"
text = "The wallpaper is the source of truth: pick one and the whole desktop follows."

[[chapters]]
id = "waybar"
title = "Waybar"

[[chapters.steps]]
title = "The top bar"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "Waybar is the bar at the top of the screen. It shows your workspaces, clock, battery, network, volume and media in progress."
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "Click a module to interact — audio, wifi, calendar",
  "Scroll over the workspace list to switch desks",
]
[[chapters.steps.blocks]]
kind = "code"
text = "~/.config/waybar/  (Modules, Layouts, style.css)"

[[chapters.steps]]
title = "Customizing it"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "Each widget is its own file under Modules/. To add, change or remove one, edit the module and reload Waybar."
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "Modules/*.jsonc — one file per widget",
  "Layouts/*.jsonc — which modules and in what order",
  "style.css + colors.css — styled and themed by matugen",
]
[[chapters.steps.blocks]]
kind = "tip"
text = "The waybar menu (menu → Waybar) reloads the bar for you."

[[chapters]]
id = "hyprland"
title = "Hyprland"

[[chapters.steps]]
title = "The compositor"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "Hyprland is the window manager. It decides how windows tile and float, how they animate, and every keyboard shortcut."
[[chapters.steps.blocks]]
kind = "code"
text = "~/.config/hypr/  (settings, keybinds, animations, profiles)"
[[chapters.steps.blocks]]
kind = "tip"
text = "Most of the desktop's behavior lives here — and it is plain Lua, easy to read."

[[chapters.steps]]
title = "Windows and workspaces"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + drag — move a window"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + Q — close the focused window"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + 1..9 — switch workspaces"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + F — toggle floating / tiling"
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "Workspaces are the numbered desks at the top",
  "Windows snap as you drag them toward an edge",
]

[[chapters]]
id = "rofi"
title = "Rofi"

[[chapters.steps]]
title = "The launcher and menus"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "Rofi is BlackNode's launcher. It opens applications, runs commands and renders most menus — themes, wallpapers, profiles and more."
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + SPACE — the main BlackNode menu"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + R — app launcher"
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "Type to filter, enter to select, esc to close",
]
[[chapters.steps.blocks]]
kind = "tip"
text = "Every menu shares the same look — learn one and you know them all."

[[chapters]]
id = "notifications"
title = "Notifications"

[[chapters.steps]]
title = "Dunst"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "Dunst shows notifications in the top-right corner: messages, music changes, low battery, script feedback."
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "Hover a notification to expand it",
  "Click it to open the app behind it",
  "Middle-click to clear it",
]
[[chapters.steps.blocks]]
kind = "code"
text = "~/.config/dunst/dunstrc"
[[chapters.steps.blocks]]
kind = "tip"
text = "Its colors follow the wallpaper too, like everything else."

[[chapters]]
id = "wallpapers"
title = "Wallpapers"

[[chapters.steps]]
title = "The color engine"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "When you pick a wallpaper, matugen reads it and generates a full Material You palette for light and dark."
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + W — open the wallpaper picker"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + SHIFT + I — switch light / dark"
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "The palette reaches Hyprland, Waybar, Rofi, Kitty, nvim, Clipse and Dunst live",
  "No reboots — apps reload on the fly",
]

[[chapters.steps]]
title = "Where the walls live"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "Wallpapers belong to a profile. Each profile bundles a vibe: walls plus a Waybar layout."
[[chapters.steps.blocks]]
kind = "code"
text = "~/.local/share/blacknode/profiles/<name>/walls/"
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "Switch vibe with the profile picker (menu → Profiles)",
  "Copy a profile folder to create your own",
]

[[chapters]]
id = "config"
title = "Configuration"

[[chapters.steps]]
title = "The blacknode CLI"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "blacknode is your command center. Everything the menus do, the terminal can do too."
[[chapters.steps.blocks]]
kind = "code"
text = "$ blacknode   # lists every command"
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "blacknode version — what's installed",
  "blacknode doctor — health check",
  "blacknode profile — switch profile",
  "blacknode theme — wallpaper / theme picker",
  "blacknode patterns — your usage stats",
]
[[chapters.steps.blocks]]
kind = "tip"
text = "blacknode alone opens this tutorial."

[[chapters]]
id = "terminal"
title = "Terminal"

[[chapters.steps]]
title = "Kitty"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "Kitty is the terminal: fast, GPU-accelerated and fully themed by the same color engine."
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + D — open a terminal"
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "Kitty has built-in tabs, splits and remote control",
  "The prompt and colors are generated from your wallpaper",
]
[[chapters.steps.blocks]]
kind = "code"
text = "~/.config/kitty/  (kitty.conf, colors)"
[[chapters.steps.blocks]]
kind = "tip"
text = "This is where BlackNode feels most at home."

[[chapters]]
id = "files"
title = "Files"

[[chapters.steps]]
title = "Browse your home"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "The file manager opens your home folder: documents, downloads, and the configs you might want to peek into."
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + E — open the file manager"
[[chapters.steps.blocks]]
kind = "code"
text = "~/.config  — the dotfiles live here, symlinked from the repo"
[[chapters.steps.blocks]]
kind = "tip"
text = "Peek inside ~/.config to see how the pieces connect."

[[chapters]]
id = "shortcuts"
title = "Shortcuts"

[[chapters.steps]]
title = "The essentials"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "You do not need to memorize anything — the menus teach you as you go. These are the ones worth knowing first:"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + SPACE — main menu"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + D — terminal"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + Q — close window"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + 1..9 — workspaces"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + W — wallpaper"
[[chapters.steps.blocks]]
kind = "keybinding"
text = "SUPER + X — power menu"
[[chapters.steps.blocks]]
kind = "tip"
text = "The complete list lives in docs/KEYBINDS.md."

[[chapters]]
id = "docs"
title = "Documentation"

[[chapters.steps]]
title = "Where to learn more"
[[chapters.steps.blocks]]
kind = "paragraph"
text = "BlackNode ships with a real manual inside the repo's docs/ folder — plain Markdown you can read in any editor."
[[chapters.steps.blocks]]
kind = "bullets"
items = [
  "KEYBINDS.md — every shortcut",
  "MODULES.md — the waybar widgets",
  "ROFI.md — menus and themes",
  "INSTALLATION.md — reinstall anytime",
  "PACKAGES.md — what's installed and why",
]
[[chapters.steps.blocks]]
kind = "code"
text = "$HOME/BlackNode/docs/"
[[chapters.steps.blocks]]
kind = "tip"
text = "That is it — welcome home. Press enter to finish."
