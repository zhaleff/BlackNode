<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6d7876"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#0a0f0f"/>
  <text x="40" y="48" fill="#dce8e6" font-size="22" font-weight="bold">blacknode-tutorial</text>
  <text x="40" y="72" fill="#6d7876" font-size="13">src/tutorial · Rust TUI · ratatui + crossterm</text>

  <!-- CLI layer -->
  <rect x="40" y="100" width="880" height="86" rx="12" fill="#131b1a" stroke="#3f4a49"/>
  <text x="60" y="124" fill="#2dd4bf" font-size="15" font-weight="bold">main.rs — CLI dispatch</text>
  <rect x="60" y="138" width="180" height="30" rx="6" fill="#1d2827"/>
  <text x="70" y="158" fill="#a2adac" font-size="12">run · --lang · --chapter</text>
  <rect x="250" y="138" width="150" height="30" rx="6" fill="#1d2827"/>
  <text x="260" y="158" fill="#a2adac" font-size="12">--status / --check</text>
  <rect x="410" y="138" width="100" height="30" rx="6" fill="#1d2827"/>
  <text x="420" y="158" fill="#a2adac" font-size="12">--reset</text>
  <text x="520" y="158" fill="#6d7876" font-size="12">first-run → opens kitty or notify-send</text>

  <!-- arrow CLI -> app -->
  <path d="M480,186 L480,210" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr)"/>

  <!-- content.rs (left) -->
  <rect x="40" y="230" width="250" height="70" rx="10" fill="#131b1a" stroke="#3f4a49"/>
  <text x="60" y="254" fill="#2dd4bf" font-size="14" font-weight="bold">content.rs</text>
  <text x="60" y="274" fill="#a2adac" font-size="12">Course / Chapter / Step / Block</text>
  <text x="60" y="290" fill="#a2adac" font-size="12">TOML loader + lang detection</text>

  <!-- app.rs (center) -->
  <rect x="330" y="230" width="300" height="70" rx="10" fill="#1d2827" stroke="#2dd4bf" stroke-width="2"/>
  <text x="350" y="254" fill="#dce8e6" font-size="14" font-weight="bold">app.rs</text>
  <text x="350" y="274" fill="#a2adac" font-size="12">navigation state machine</text>
  <text x="350" y="290" fill="#a2adac" font-size="12">next/prev · chapters · picker · done</text>

  <!-- state.rs (right) -->
  <rect x="670" y="230" width="250" height="70" rx="10" fill="#131b1a" stroke="#3f4a49"/>
  <text x="690" y="254" fill="#2dd4bf" font-size="14" font-weight="bold">state.rs</text>
  <text x="690" y="274" fill="#a2adac" font-size="12">progress: completed · seen</text>
  <text x="690" y="290" fill="#a2adac" font-size="12">nudged · current position</text>

  <!-- ui.rs -->
  <rect x="330" y="360" width="300" height="70" rx="10" fill="#131b1a" stroke="#3f4a49"/>
  <text x="350" y="384" fill="#2dd4bf" font-size="14" font-weight="bold">ui.rs</text>
  <text x="350" y="404" fill="#a2adac" font-size="12">ratatui renderer: header · blocks</text>
  <text x="350" y="420" fill="#a2adac" font-size="12">picker · done · key hints</text>

  <!-- files bottom -->
  <rect x="40" y="480" width="250" height="80" rx="10" fill="#0e1514" stroke="#3f4a49" stroke-dasharray="4 3"/>
  <text x="60" y="504" fill="#dce8e6" font-size="13" font-weight="bold">course.&lt;lang&gt;.toml</text>
  <text x="60" y="522" fill="#6d7876" font-size="12">course.toml · course.es.toml</text>
  <text x="60" y="540" fill="#6d7876" font-size="12">~/.local/share/blacknode/tutorial/</text>

  <rect x="670" y="480" width="250" height="80" rx="10" fill="#0e1514" stroke="#3f4a49" stroke-dasharray="4 3"/>
  <text x="690" y="504" fill="#dce8e6" font-size="13" font-weight="bold">tutorial.json</text>
  <text x="690" y="522" fill="#6d7876" font-size="12">progress state</text>
  <text x="690" y="540" fill="#6d7876" font-size="12">~/.local/share/blacknode/</text>

  <rect x="330" y="480" width="300" height="80" rx="10" fill="#0e1514" stroke="#3f4a49"/>
  <text x="350" y="504" fill="#dce8e6" font-size="13" font-weight="bold">terminal</text>
  <text x="350" y="522" fill="#6d7876" font-size="12">crossterm events → key handling</text>
  <text x="350" y="540" fill="#6d7876" font-size="12">enter · tab · c · ? · q</text>

  <!-- arrows -->
  <path d="M165,300 L175,355 L480,355" stroke="#6d7876" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M795,300 L790,355 L630,355" stroke="#6d7876" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M480,300 L480,360" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M165,480 L165,455 L165,310" stroke="#6d7876" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M795,480 L795,310" stroke="#6d7876" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M480,430 L480,480" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr)"/>

  <!-- notes -->
  <text x="300" y="340" fill="#6d7876" font-size="11">loads</text>
  <text x="668" y="340" fill="#6d7876" font-size="11">persist</text>
  <text x="40" y="610" fill="#6d7876" font-size="12">blacknode help · SUPER + F1 · first-run autostart → blacknode-tutorial</text>
</svg>
